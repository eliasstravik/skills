[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefold"
version = "0.2.0"
description = "Turn exported CI job events into a local failure brief."
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ci", "github-actions", "debugging", "cli"]

[project.scripts]
tracefold = "tracefold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
