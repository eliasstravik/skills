<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consulting</title>
<style>@font-face{font-family:InterVariable;font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/InterVariable.woff2") format("woff2")}:root{color-scheme:light dark;--bg:#fff;--fg:#0a0a0a;--sub:#525252;--muted:#737373;--line:rgb(10 10 10/.08);--line2:rgb(10 10 10/.14);--fill:#f5f5f5;--accent:#c2410c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#fafafa;--sub:#d4d4d4;--muted:#a3a3a3;--line:rgb(255 255 255/.09);--line2:rgb(255 255 255/.16);--fill:#1c1c1c;--accent:#fb923c;--ok:#4ade80}}
*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 InterVariable,ui-sans-serif,system-ui,sans-serif;font-feature-settings:"cv02","cv03","cv04","cv11";-webkit-font-smoothing:antialiased}
@media(min-width:640px){body{font-size:14px;line-height:1.7143}}
button,textarea,input{font:inherit;color:inherit;letter-spacing:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

#app{isolation:isolate;min-height:100dvh;display:flex;flex-direction:column}
header{padding:20px 20px 12px;display:grid;justify-items:center;gap:14px;text-align:center}
.nav{display:flex;align-items:center;gap:4px}
.nav .arr{width:28px;height:28px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);position:relative}
.nav .arr::after{content:"";position:absolute;inset:-8px}.nav .arr:disabled{opacity:.3;cursor:default}
.where{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--fill);border-radius:999px;padding:6px 14px;color:var(--sub);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
dialog{border:0;border-radius:14px;background:var(--bg);color:var(--fg);padding:0;margin:68px auto 0;width:min(36rem,calc(100vw - 24px));max-height:min(32rem,calc(100dvh - 96px));box-shadow:0 0 0 1px var(--line2),0 16px 40px rgb(0 0 0/.16);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}dialog::backdrop{background:rgb(0 0 0/.25)}
.find{border:0;border-bottom:1px solid var(--line);background:none;padding:14px 18px;display:block;width:100%;outline:0;border-radius:0}
.find::placeholder{color:var(--muted)}.find::-webkit-search-cancel-button{display:none}
.rows{flex:1;overflow:auto;padding:6px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.rows::-webkit-scrollbar{width:10px}.rows::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:3px solid var(--bg)}.rows::-webkit-scrollbar-track{background:transparent}
.sl{display:grid;grid-template-columns:2.25rem minmax(0,1fr) minmax(0,auto);gap:0 12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 12px;outline:0}
.sl:hover,.sl:focus-visible{background:var(--fill)}
.sl .n{color:var(--muted);font-variant-numeric:tabular-nums}
.sl .t,.sl .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl .a{color:var(--muted);max-width:14rem}
.sl.cur .t{font-weight:500}.sl.cur .a{color:var(--accent)}
.none{margin:0;padding:10px 12px;color:var(--muted)}
@media(prefers-color-scheme:dark){dialog{background:#141414;box-shadow:0 0 0 1px var(--line2)}.rows::-webkit-scrollbar-thumb{border-color:#141414}}
@media(max-width:639px){dialog{margin-top:60px}.sl{grid-template-columns:2.25rem minmax(0,1fr);padding:9px 12px}.sl .a{grid-column:2;max-width:none}}
.head{display:grid;gap:8px;justify-items:center}
h1{font-size:1.875rem;line-height:1.2;font-weight:600;letter-spacing:-.03em;margin:0;text-wrap:balance;max-width:28ch}
.sub{margin:0;font-size:1rem;line-height:1.5;color:var(--muted);max-width:64ch;text-wrap:balance;min-height:1.5em}
.sub b{color:var(--fg);font-weight:500}.sub i{font-style:normal;color:var(--accent);font-weight:500}
/* One page, one scroll: nothing scrolls inside anything. Each prototype frame takes its content's height (see grow());
   a live app on another origin cannot be measured and keeps 80dvh. */
main{display:flex;flex-direction:column;padding-bottom:calc(88px + env(safe-area-inset-bottom))}main>iframe{width:100%;height:80dvh;border:0;display:block}
.cap{margin:0 auto;padding:8px 20px 0;font-size:.82rem;line-height:1.5;color:var(--muted);text-align:center;max-width:44ch;text-wrap:balance}
.st{margin:0;font-size:.85rem;color:var(--muted);text-align:center}.hint{margin:0;font-size:.8rem;color:var(--muted);text-align:center}
footer{padding:4px 20px 12px;display:grid;justify-items:center;gap:10px}
/* Options sit right under the question, one per line, labels wrapped, never cut off. */
.seg{display:grid;gap:2px;background:var(--fill);border-radius:12px;padding:3px;width:min(32rem,100%)}
.seg button{display:flex;gap:6px;border:0;background:none;border-radius:9px;padding:9px 12px;font-weight:500;color:var(--muted);text-align:left;white-space:normal;overflow-wrap:anywhere;text-wrap:pretty;min-width:0}
.seg button[aria-checked=true]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line2),0 1px 2px rgb(0 0 0/.08)}
.seg button:disabled{cursor:default}
.seg .num{font-variant-numeric:tabular-nums;opacity:.6;font-weight:400;flex:none}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:7px 16px;font-weight:500;white-space:nowrap;z-index:5}
@media(prefers-color-scheme:dark){.seg button[aria-checked=true]{box-shadow:0 0 0 1px var(--line2)}}
@media(max-width:639px){header{padding:14px 16px 8px;gap:10px}h1{font-size:1.5rem}.seg button{padding:11px 10px}}
.sl.ret{opacity:.45}
.plan{min-width:0;padding:8px 20px 0}
.doc{max-width:44rem;margin:0 auto;overflow-wrap:break-word}
.doc h2,.doc h3,.doc h4{font-weight:600;letter-spacing:-.03em;line-height:1.3;margin:1.6em 0 .4em;text-wrap:balance}
.doc h2{font-size:1.5rem}.doc h3{font-size:1.25rem}.doc h4{font-size:1rem}
.doc p,.doc ul,.doc ol{margin:0 0 1em}.doc ul,.doc ol{padding-left:1.5em}.doc li>ul,.doc li>ol{margin:0}
.doc code{font:.875em/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--fill);border-radius:8px;padding:.1em .35em}
.doc pre{background:var(--fill);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:0 0 1em}.doc pre code{background:none;padding:0}
.doc b{font-weight:600}.doc a{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.tw{overflow-x:auto;margin:0 0 1em}.doc table{border-collapse:collapse;min-width:100%}
.doc th,.doc td{text-align:left;vertical-align:top;padding:8px 16px 8px 0;border-bottom:1px solid var(--line)}.doc th{font-weight:600}
.whole{display:grid;gap:10px;justify-items:center;margin:0 auto 32px}.whole .cap{padding:0}
.badge{font-size:.8rem;font-weight:600;color:var(--accent)}.found{border:1.5px dashed var(--accent);border-radius:10px;padding:8px 10px;color:var(--accent);font-size:.8rem;text-align:center;width:min(22rem,100%)}.badge.frozen{color:var(--ok)}
#proto{width:100%;height:80dvh;border:0;display:block}
.doc+.doc{border-top:1px solid var(--line);margin-top:32px;padding-top:8px}
@media(max-width:639px){.where{min-height:44px}.nav .arr{min-width:44px;min-height:44px}.plan{padding:4px 20px 0}}
/* Narrow screens stack header, options, status, then the visual, and the whole page scrolls; nothing is pinned.
   From 1024px a left sidebar holds everything but the visual. The sidebar stays in view while it fits the window;
   a taller one scrolls with the page until its end shows (its top is set in place()). */
.side{display:contents}.st{padding:0 20px}.hint{padding:0 20px 12px}
@media(min-width:1024px){
#app.split{display:grid;grid-template-columns:clamp(24rem,30vw,28rem) minmax(0,1fr);align-items:start}
.split .side{display:flex;flex-direction:column;gap:16px;padding:24px;position:sticky;top:0}
.split header,.split .head{display:contents}.split header{text-align:left}
.split .nav{order:0;align-self:center;margin:0 0 8px}
.split h1{order:1;font-size:1.5rem;line-height:1.3;max-width:none;text-wrap:pretty}
.split footer{order:2;padding:0;display:block}.split .seg{width:100%}
.split .sub{order:3;max-width:none;text-wrap:pretty}.split .st{order:4;padding:0}.split .hint{order:5;padding:0}
.split main{min-width:0;min-height:100dvh;border-left:1px solid var(--line)}.split .plan{padding:40px 40px 0}
}
</style>
<body>
<div id="app">
<div class="side"><header><nav class="nav" id="nav" data-feedback-toolbar></nav><div class="head"><h1 id="q"></h1><p class="sub" id="sub" aria-live="polite"></p></div></header>
<footer id="foot" data-feedback-toolbar hidden><div class="seg" id="seg" role="radiogroup" aria-label="Options"></div></footer><p class="st" id="st" hidden></p><p class="hint" id="hint" hidden>Answer in chat, or copy it from here, as with any question.</p></div>
<main><iframe id="frame" title="Prototype for this question" hidden></iframe><div class="plan" id="plan" hidden><div class="whole"><p class="cap" id="wcap" hidden></p><span class="badge" id="badge"></span><div class="found" id="rev" hidden>Reviewer is reading the handoff…</div><iframe id="proto" title="The whole prototype"></iframe></div><div class="doc" id="doc"></div><div class="doc" id="odoc" hidden></div></div></main>
</div>
<dialog id="list" aria-label="All questions" data-feedback-toolbar></dialog><div id="agn"></div>
<script>(()=>{
const h=(t,p,...k)=>{const e=document.createElement(t);for(const a in p||{}){const v=p[a];if(v==null||v===false)continue;if(a==='text')e.textContent=v;else if(a==='cls')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else e.setAttribute(a,v===true?'':v)}for(const c of k)if(c)e.append(c);return e};
function chev(left){const N='http://www.w3.org/2000/svg',s=document.createElementNS(N,'svg');s.setAttribute('viewBox','0 0 6 10');s.setAttribute('width','6');s.setAttribute('height','10');s.setAttribute('fill','none');s.setAttribute('aria-hidden','true');if(left)s.style.transform='rotate(180deg)';const p=document.createElementNS(N,'path');p.setAttribute('d','m1 1 4 4-4 4');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','1.5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');s.append(p);return s}
function chevDown(){const c=chev();c.style.transform='rotate(90deg)';return c}
const FILE=/^steps\/[0-9]+-[a-z0-9-]+\.html$/,STEPLINK=/^page\/(steps\/[0-9]+-[a-z0-9-]+\.html(?:#option=[A-Za-z0-9_-]+)?)$/,MEDIALINK=/^page\/(media\/[A-Za-z0-9._-]+\.(?:png|jpe?g|gif|webp|avif|mp4|webm|mp3|wav|ogg))$/i;
const $=id=>document.getElementById(id),frame=$('frame');
/* view: null follows the session (open question, else the plan, else the last question); a number or 'plan' is the client's own pick. */
let S=null,raw='',sig='',view=null,mode='wait',sel={},step=null,ro=false,loaded='',planRaw=null,openRaw=null,planKey='',pend=null,pendKey='',protoSrc='',protoRaw=null;
const cur_=()=>S.steps.find(s=>s.decision==null&&!s.retired),byN=n=>S.steps.find(s=>s.n===n);
const opt=(s,k)=>s.options.find(o=>o.key===k);
const other=s=>String(s.decision).replace(/^Other\s*[\u2014\u2013-]\s*/,'');
const shown=s=>{const o=opt(s,s.decision);return o?o.key+'. '+o.label:other(s)};
const chosen=()=>ro?step.decision:sel[step.n];
const whole=()=>!!(S.plan||S.pending||S.frozen);
const liveOk=x=>{try{const u=new URL(String(x));return u.protocol==='https:'||(u.protocol==='http:'&&u.hostname==='127.0.0.1')}catch(e){return false}};
const pendingOf=()=>{const p=S.pending;return p&&typeof p==='object'&&Array.isArray(p.options)&&p.options.length?p:null};
function status(t){$('st').textContent=t?String(t):'';$('st').hidden=!t}
function caption(el,t){el.textContent=t?String(t):'';el.hidden=!t}
function explain(o,rec){return[h('b',{text:o.label}),' \u00b7 ',rec&&h('i',{text:'Recommended.'}),rec&&' ',o.tradeoff].filter(Boolean)}
function go(s){view=s==='plan'?'plan':s===cur_()?null:s.n;build()}
function arrow(label,to,left){return h('button',{cls:'arr',type:'button','aria-label':label,disabled:!to,onclick:()=>to&&go(to)},chev(left))}
function pill(text){return h('button',{cls:'where',type:'button','aria-haspopup':'dialog','aria-label':text+'. Show all questions',onclick:openList},h('span',{text}),chevDown())}
function build(){
 if(!S)return;const open=cur_(),last=S.steps[S.steps.length-1];
 mode=whole()&&(view==='plan'||(view==null&&!open))?'plan':last?'step':'wait';
 $('app').classList.toggle('split',mode!=='wait');frame.hidden=mode!=='step';$('plan').hidden=mode!=='plan';$('foot').hidden=mode!=='step';
 if(mode==='wait'){$('nav').replaceChildren();$('q').textContent='Waiting for the first question.';$('sub').replaceChildren();$('seg').replaceChildren();status('');$('hint').hidden=true;return}
 if(mode==='plan'){wholeView(last);return}
 pend=null;$('hint').hidden=true;status('');
 step=byN(view)||open||last;ro=step.decision!=null||!!step.retired;if(sel[step.n]==null)sel[step.n]=step.recommended;
 const total=S.steps.length+(S.remaining>0?S.remaining:0),i=S.steps.indexOf(step);
 $('nav').replaceChildren(arrow('Previous question',S.steps[i-1],true),pill('Question '+step.n+' of about '+total),arrow('Next question',S.steps[i+1]||(whole()?'plan':null)));
 $('q').textContent=step.question;
 $('seg').replaceChildren(...step.options.map(o=>h('button',{type:'button',role:'radio','data-opt':o.key,disabled:ro,'aria-label':'Option '+o.key+', '+o.label,onclick:()=>{sel[step.n]=o.key;sync()}},h('span',{cls:'num',text:o.key+'.'}),' '+o.label)));
 sync();place();if(String(step.n)!==location.hash.slice(1))history.replaceState(null,'','#'+step.n);
}
/* The whole-thing view: the pending review question (or the handoff) in the sidebar; caption, badge, the whole prototype, plan.md and open.md in the frame. */
function wholeView(last){
 const P=S.frozen?null:pendingOf(),k=P?JSON.stringify([P.label,P.question,P.options,P.recommended]):'';
 if(k!==pendKey){pendKey=k;sel.p=P?P.recommended:null}pend=P;
 $('foot').hidden=!P;$('hint').hidden=!P;
 $('nav').replaceChildren(arrow('Previous question',last,true),pill(S.frozen?'Handoff':P?String(P.label):'Plan'),arrow('Next question',null));
 $('q').textContent=S.frozen?'Handoff':P?String(P.question):'Plan';status(S.frozen?'':S.reviewStatus);
 if(P){$('seg').replaceChildren(...P.options.map(o=>h('button',{type:'button',role:'radio','data-opt':o.key,'aria-label':'Option '+o.key+', '+o.label,onclick:()=>{sel.p=o.key;syncPending()}},h('span',{cls:'num',text:o.key+'.'}),' '+o.label)));syncPending()}
 else{$('seg').replaceChildren();$('sub').replaceChildren()}
 caption($('wcap'),S.frozen?'Frozen. This prototype is the spec the builder must match.':P&&P.caption);
 $('rev').hidden=!!S.frozen||!((P&&P.label==='Review')||/running/.test(String(S.reviewStatus||'')));
 $('badge').textContent=S.frozen?'\u25cf Frozen \u00b7 the spec':'Whole thing';$('badge').classList.toggle('frozen',!!S.frozen);
 const src=liveOk(S.live)?String(S.live):'prototype/index.html';if(src!==protoSrc){protoSrc=src;protoRaw=null;$('proto').src=src}
 if(location.hash!=='#plan')history.replaceState(null,'','#plan');loadPlan();place()}
function syncPending(){const o=opt(pend,sel.p)||opt(pend,pend.recommended)||pend.options[0];
 document.querySelectorAll('#seg [data-opt]').forEach(b=>b.setAttribute('aria-checked',String(o&&o.key===b.dataset.opt)));
 $('sub').replaceChildren(...(o?explain(o,o.key===pend.recommended):[]))}
/* The page is the only thing that scrolls: each prototype frame takes its content's height, the desktop sidebar sticks only as far as it fits. */
function grow(f){try{const d=f.contentDocument,r=d&&d.documentElement;if(!r){f.style.height='';return}if(!d.body)return;const px=Math.ceil(Math.max(r.getBoundingClientRect().height,d.body.scrollHeight));if(px&&Math.abs(f.offsetHeight-px)>=1)f.style.height=px+'px'}catch(e){}}
function place(){const s=document.querySelector('.side');s.style.top=Math.min(0,innerHeight-s.offsetHeight)+'px';grow(frame);grow($('proto'))}
function sync(){
 const picked=opt(step,chosen()),else_=ro&&!picked,o=picked||opt(step,step.recommended)||step.options[0];
 document.querySelectorAll('#seg [data-opt]').forEach(b=>b.setAttribute('aria-checked',String(!else_&&chosen()===b.dataset.opt)));
 if(else_)$('sub').replaceChildren('You chose something else: ',h('b',{text:other(step)}));
 else if(o)$('sub').replaceChildren(...(ro?['You chose ',h('b',{text:o.key+'. '+o.label}),'. ',o.tradeoff]:explain(o,o.key===step.recommended)));
 else $('sub').replaceChildren();
 if(!ro&&o&&liveOk(step.live)){const l=String(step.live),url=l+(l.includes('?')?'&':'?')+'variant='+encodeURIComponent(o.key);if(loaded!==url){loaded=url;frame.src=url}}
 else if(FILE.test(step.file)){const url=step.file+(o?'#option='+encodeURIComponent(o.key):'');if(loaded===step.file){try{frame.contentWindow.location.replace(url)}catch(e){}}else{loaded=step.file;frame.src=url}}
 else{loaded='';frame.removeAttribute('src')}
}
function openList(){const list=$('list'),rows=h('div',{cls:'rows'});
 const fill=q=>{const m=S.steps.filter(s=>!q||(s.n+' '+s.question).toLowerCase().includes(q));if(whole()&&(!q||'plan'.includes(q)))m.push('plan');
  rows.replaceChildren(...m.map(s=>{if(s==='plan')return h('button',{cls:'sl'+(mode==='plan'?' cur':''),type:'button','aria-current':mode==='plan'?'step':null,onclick:()=>{list.close();go('plan')}},h('span',{cls:'n'}),h('span',{cls:'t',text:'Plan'}),h('span',{cls:'a'}));
   const on=mode==='step'&&s===step,o=opt(s,s.decision);return h('button',{cls:'sl'+(on?' cur':'')+(s.retired?' ret':''),type:'button','aria-current':on?'step':null,onclick:()=>{list.close();go(s)}},h('span',{cls:'n',text:s.n}),h('span',{cls:'t',text:s.question}),h('span',{cls:'a',text:s.retired?'No longer needed':s.decision==null?'Open':(o?o.label:other(s))}))}));
  if(!m.length)rows.append(h('p',{cls:'none',text:'No question matches.'}));else if(!q&&S.remaining>0)rows.append(h('p',{cls:'none',text:'About '+S.remaining+' more to come.'}));return m};
 const find=h('input',{cls:'find',type:'search',name:'find',autocomplete:'off','aria-label':'Find a question',placeholder:'Find a question'});
 find.oninput=()=>fill(find.value.trim().toLowerCase());find.onkeydown=e=>{if(e.key==='Enter'){const m=fill(find.value.trim().toLowerCase());if(m.length){list.close();go(m[0])}}};
 fill('');list.replaceChildren(find,rows);list.showModal();requestAnimationFrame(()=>{const c=rows.querySelector('.cur');if(c)c.scrollIntoView({block:'center'})})}
$('list').addEventListener('click',e=>{if(e.target===$('list'))$('list').close()});
/* The plan view: plan.md drawn with DOM nodes only, then one block per answered question. */
function link(label,target){let href=null,m;if((m=STEPLINK.exec(target))||(m=MEDIALINK.exec(target))||(m=/^page\/(prototype\/index\.html)$/.exec(target)))href=m[1];else{try{const u=new URL(target);if(u.protocol==='http:'||u.protocol==='https:')href=u.href}catch(e){}}

function inline(t,into){const re=/`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g;let i=0,m;
 while((m=re.exec(t))){if(m.index>i)into.append(t.slice(i,m.index));if(m[1]!=null)into.append(h('code',{text:m[1]}));else if(m[2]!=null)into.append(inline(m[2],h('b')));else into.append(link(m[3],m[4])||m[0]);i=re.lastIndex}
 if(i<t.length)into.append(t.slice(i));return into}
function md(src){const out=document.createDocumentFragment(),L=src.replace(/\r\n?/g,'\n').split('\n');let i=0,para=[],lists=[];
 const flush=()=>{if(para.length){out.append(inline(para.join(' '),h('p')));para=[]}};
 const cells=r=>{r=r.trim();if(r.startsWith('|'))r=r.slice(1);if(r.endsWith('|'))r=r.slice(0,-1);return r.split('|').map(c=>c.trim())};
 const item=(ind,num,text)=>{const ord=num!=null;while(lists.length&&lists[lists.length-1].ind>ind)lists.pop();let top=lists[lists.length-1];
  if(!top||top.ind<ind||top.ord!==ord){if(top&&top.ind===ind)lists.pop();const up=lists[lists.length-1],el=h(ord?'ol':'ul',{start:ord&&num!=='1'?num:null});(up?up.li:out).append(el);top={ind,ord,el,li:null};lists.push(top)}
  top.li=inline(text,h('li'));top.el.append(top.li)};
 while(i<L.length){const l=L[i];let m;
  if((m=/^\s*(```|~~~)/.exec(l))){flush();lists=[];const b=[];i++;while(i<L.length&&!L[i].trim().startsWith(m[1]))b.push(L[i++]);i++;out.append(h('pre',null,h('code',{text:b.join('\n')})));continue}
  if(!l.trim()){flush();i++;continue}
  if((m=/^(#{1,6})\s+(.*?)\s*#*$/.exec(l))){flush();lists=[];out.append(inline(m[2],h('h'+Math.min(m[1].length+1,4))));i++;continue}
